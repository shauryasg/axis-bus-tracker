<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CampusRide - Coordinator Dashboard</title>
  
  <!-- Official Google Maps SDK -->
<!-- Official Google Maps SDK -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAuzSJx40q1GzH2RZ-EZCE9iRzl-xkaQho&libraries=geometry"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --green: #16a34a;
      --green-bg: #dcfce7;
      --red: #dc2626;
      --red-bg: #fee2e2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0b1329; display: flex; justify-content: center; min-height: 100vh; }
    
    .app-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .top-bar .title-group h3 { font-size: 16px; font-weight: 700; color: var(--text); }
    .top-bar .title-group p { font-size: 11px; color: var(--text-muted); }
    .icon-btn { background: none; border: none; font-size: 22px; color: var(--text); cursor: pointer; display: flex; align-items: center; }

    .view { display: none; flex-direction: column; height: 100%; width: 100%; overflow-y: auto; padding-bottom: 75px; }
    .view.active { display: flex; }
    .content-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }

    .hero-banner {
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      border-radius: 16px;
      padding: 18px 20px;
      color: white;
    }
    .hero-banner h2 { font-size: 18px; margin-bottom: 2px; }
    .hero-banner p { font-size: 12px; opacity: 0.9; }

    .section-head { display: flex; justify-content: space-between; align-items: center; }
    .section-head h4 { font-size: 14px; font-weight: 700; color: var(--text); }
    .badge-tag { font-size: 11px; font-weight: 700; color: var(--primary); background: var(--primary-light); padding: 4px 8px; border-radius: 6px; }

    .bus-list { display: flex; flex-direction: column; gap: 10px; }
    .bus-card {
      background: var(--surface);
      border-radius: 14px;
      padding: 14px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bus-card.assigned { border: 2px solid var(--primary); background: #f0f7ff; }
    .bus-top-row { display: flex; align-items: center; justify-content: space-between; }
    .bus-meta-group { display: flex; align-items: center; gap: 12px; }
    .bus-icon-wrap {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .bus-id { font-size: 14px; font-weight: 700; color: var(--text); }
    .bus-route { font-size: 12px; color: var(--text-muted); }
    .status-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
    .status-live { background: var(--green-bg); color: var(--green); }
    .status-off { background: var(--red-bg); color: var(--red); }

    .bus-control-row { display: flex; gap: 8px; border-top: 1px solid var(--border); padding-top: 10px; }
    .btn-broadcast { flex: 1; padding: 11px; border-radius: 9px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-start-gps { background: var(--green); color: #fff; }
    .btn-stop-gps { background: var(--red); color: #fff; display: none; }

    .home-map-box { display: none; margin-top: 4px; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); height: 230px; position: relative; }
    #homeMiniMap { width: 100%; height: 100%; }

    #routesView { position: relative; padding-bottom: 0; }
    #fullRouteMap { width: 100%; height: 100%; }

    .bottom-nav {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 65px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }
    .nav-tab { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); font-size: 10px; cursor: pointer; border: none; background: none; flex: 1; }
    .nav-tab i { font-size: 20px; }
    .nav-tab.active { color: var(--primary); font-weight: 600; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-card { background: #fff; width: 100%; max-width: 380px; border-radius: 18px; padding: 22px; }
    .modal-card textarea { width: 100%; height: 90px; padding: 10px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; outline: none; margin: 12px 0; resize: none; }
    .modal-actions { display: flex; gap: 8px; }
    .btn-modal { flex: 1; padding: 10px; border-radius: 8px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

<div class="app-container">
  
  <div class="top-bar">
    <div class="title-group">
      <h3>CampusRide</h3>
      <p>Coordinator Broadcast Portal</p>
    </div>
    <div style="display: flex; gap: 8px;">
      <button class="icon-btn" onclick="openAnnounceModal()" title="Broadcast Delay"><i class="ph-bold ph-megaphone"></i></button>
      <button class="icon-btn" onclick="logout()" title="Logout"><i class="ph-bold ph-sign-out"></i></button>
    </div>
  </div>

  <!-- HOME VIEW -->
  <div class="view active" id="homeView">
    <div class="content-body">
      <div class="hero-banner">
        <h2 id="coordHeroName">Welcome, Coordinator 👋</h2>
        <p id="coordHeroBus">Assigned Bus: BUS 1</p>
      </div>

      <div class="section-head">
        <h4>Fleet Control</h4>
        <span class="badge-tag" id="myBusBadge">MY BUS: BUS 1</span>
      </div>

      <div class="bus-list" id="coordBusList"></div>

      <!-- Mini Live Broadcast Google Map -->
      <div class="home-map-box" id="homeMapBox">
        <div id="homeMiniMap"></div>
      </div>
    </div>
  </div>

  <!-- FULL MAP VIEW -->
  <div class="view" id="routesView">
    <div id="fullRouteMap"></div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-tab active" onclick="switchTab('homeView', this)"><i class="ph-bold ph-house"></i><span>Home</span></button>
    <button class="nav-tab" onclick="switchTab('routesView', this)"><i class="ph-bold ph-navigation-arrow"></i><span>Route Map</span></button>
  </nav>

</div>

<!-- Delay Modal -->
<div class="modal-overlay" id="announceModal">
  <div class="modal-card">
    <h3 style="font-size: 16px;">Broadcast Delay Alert</h3>
    <p style="font-size: 11px; color: var(--text-muted);">Target: Assigned bus passengers</p>
    <textarea id="modalInput" placeholder="e.g. Delayed by 10 mins near Kakadev..."></textarea>
    <div class="modal-actions">
      <button class="btn-modal" style="background: #f1f5f9;" onclick="closeAnnounceModal()">Cancel</button>
      <button class="btn-modal" style="background: var(--primary); color: white;" onclick="submitAnnouncement()">Broadcast</button>
    </div>
  </div>
</div>

<script type="module">
  import { db, ref, set, update, onValue } from "./firebase-config.js";
  import { AXIS_BUS_ROUTES } from "./bus-routes.js";

  const session = JSON.parse(localStorage.getItem("campusride_user") || "null");
  if (!session || session.role !== "coordinator") {
    window.location.href = "login.html";
  }

  window.logout = function () {
    localStorage.removeItem("campusride_user");
    window.location.href = "login.html";
  };

  const assignedBus = session.busId || "BUS 1";
  document.getElementById("coordHeroName").innerText =
    `Welcome, ${session.name || "Coordinator"} 👋`;
  document.getElementById("coordHeroBus").innerText =
    `Assigned Bus: ${assignedBus}`;
  document.getElementById("myBusBadge").innerText =
    `MY BUS: ${assignedBus}`;

  let fullGoogleMap = null;
  let miniGoogleMap = null;
  let fullBusMarker = null;
  let miniBusMarker = null;
  let liveTrailFull = null;
  let liveTrailMini = null;
  let watchId = null;
  let broadcastingBusId = null;

  function initGoogleCoordinatorMaps() {
    const defaultCenter = { lat: 26.4499, lng: 80.3319 };

    if (!fullGoogleMap && document.getElementById("fullRouteMap")) {
      fullGoogleMap = new google.maps.Map(
        document.getElementById("fullRouteMap"),
        {
          center: defaultCenter,
          zoom: 13,
          disableDefaultUI: true,
          zoomControl: true
        }
      );

      drawCoordinatorRoute(fullGoogleMap);

      liveTrailFull = new google.maps.Polyline({
        path: [],
        geodesic: true,
        strokeColor: "#2563eb",
        strokeOpacity: 0.9,
        strokeWeight: 4,
        map: fullGoogleMap
      });
    }

    if (!miniGoogleMap && document.getElementById("homeMiniMap")) {
      miniGoogleMap = new google.maps.Map(
        document.getElementById("homeMiniMap"),
        {
          center: defaultCenter,
          zoom: 13,
          disableDefaultUI: true
        }
      );

      drawCoordinatorRoute(miniGoogleMap);

      liveTrailMini = new google.maps.Polyline({
        path: [],
        geodesic: true,
        strokeColor: "#2563eb",
        strokeOpacity: 0.9,
        strokeWeight: 4,
        map: miniGoogleMap
      });
    }
  }

  function drawCoordinatorRoute(mapInstance) {
    const myRoute = AXIS_BUS_ROUTES[assignedBus];
    if (!myRoute || !myRoute.stops?.length) return;

    const path = myRoute.stops.map(s => ({
      lat: Number(s.lat),
      lng: Number(s.lng)
    }));

    new google.maps.Polyline({
      path,
      geodesic: true,
      strokeColor: myRoute.color || "#2563eb",
      strokeOpacity: 0.85,
      strokeWeight: 5,
      map: mapInstance
    });

    const bounds = new google.maps.LatLngBounds();
    path.forEach(pos => bounds.extend(pos));
    mapInstance.fitBounds(bounds);
  }

  function updateCoordinatorMarkers(lat, lng) {
    const pos = new google.maps.LatLng(lat, lng);

    const iconConfig = {
      url: "https://maps.google.com/mapfiles/kml/shapes/bus.png",
      scaledSize: new google.maps.Size(36, 36),
      anchor: new google.maps.Point(18, 18)
    };

    if (miniGoogleMap) {
      if (!miniBusMarker) {
        miniBusMarker = new google.maps.Marker({
          position: pos,
          map: miniGoogleMap,
          title: assignedBus,
          icon: iconConfig
        });
      } else {
        miniBusMarker.setPosition(pos);
      }
      miniGoogleMap.panTo(pos);
    }

    if (fullGoogleMap) {
      if (!fullBusMarker) {
        fullBusMarker = new google.maps.Marker({
          position: pos,
          map: fullGoogleMap,
          title: assignedBus,
          icon: iconConfig
        });
      } else {
        fullBusMarker.setPosition(pos);
      }
      fullGoogleMap.panTo(pos);
    }

    if (liveTrailMini) liveTrailMini.getPath().push(pos);
    if (liveTrailFull) liveTrailFull.getPath().push(pos);
  }

  window.switchTab = function (viewId, tabEl) {
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    document.getElementById(viewId).classList.add("active");

    document.querySelectorAll(".nav-tab").forEach(t => t.classList.remove("active"));
    tabEl.classList.add("active");

    if (viewId === "routesView") {
      setTimeout(initGoogleCoordinatorMaps, 100);
    }
  };

  const coordBusList = document.getElementById("coordBusList");
  const busKeys = Object.keys(AXIS_BUS_ROUTES);

  function renderCards() {
    coordBusList.innerHTML = busKeys.map(bId => {
      const isMine = bId === assignedBus;
      const safeId = bId.replace(/\s+/g, "_");
      const r = AXIS_BUS_ROUTES[bId];

      return `
        <div class="bus-card ${isMine ? "assigned" : ""}">
          <div class="bus-top-row">
            <div class="bus-meta-group">
              <div class="bus-icon-wrap" id="icon_${safeId}">
                <i class="ph-bold ph-bus"></i>
              </div>
              <div>
                <div class="bus-id">
                  ${bId}
                  ${isMine ? '<span style="font-size:10px; color:#2563eb;">(MY BUS)</span>' : ""}
                </div>
                <div class="bus-route">${r ? r.routeName : "Route"}</div>
              </div>
            </div>
            <span class="status-badge status-off" id="pill_${safeId}">OFFLINE</span>
          </div>

          ${isMine ? `
            <div class="bus-control-row">
              <button class="btn-broadcast btn-start-gps"
                id="btnStart_${safeId}"
                onclick="startBroadcast('${bId}')">
                <i class="ph-bold ph-broadcast"></i> Make Bus Live (GPS)
              </button>
              <button class="btn-broadcast btn-stop-gps"
                id="btnStop_${safeId}"
                onclick="stopBroadcast('${bId}')">
                <i class="ph-bold ph-stop-circle"></i> Stop Broadcast
              </button>
            </div>
          ` : ""}
        </div>
      `;
    }).join("");
  }

  renderCards();

  onValue(ref(db, "buses"), snapshot => {
    const data = snapshot.val() || {};

    busKeys.forEach(bId => {
      const b = data[bId];
      const safeId = bId.replace(/\s+/g, "_");
      const pill = document.getElementById(`pill_${safeId}`);

      if (pill) {
        pill.className = b?.isActive
          ? "status-badge status-live"
          : "status-badge status-off";
        pill.innerText = b?.isActive ? "LIVE" : "OFFLINE";
      }
    });
  });

  window.startBroadcast = function (bId) {
    if (!navigator.geolocation) {
      alert("GPS is not supported on this device/browser.");
      return;
    }

    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }

    const safeId = bId.replace(/\s+/g, "_");
    const startBtn = document.getElementById(`btnStart_${safeId}`);
    const stopBtn = document.getElementById(`btnStop_${safeId}`);

    if (startBtn) startBtn.style.display = "none";
    if (stopBtn) stopBtn.style.display = "flex";

    document.getElementById("homeMapBox").style.display = "block";
    initGoogleCoordinatorMaps();
    broadcastingBusId = bId;

    const pushGPS = async (lat, lng, speedKmh) => {
      try {
        await update(ref(db, `buses/${bId}`), {
          latitude: lat,
          longitude: lng,
          speed: speedKmh,
          isActive: true,
          coordinatorName: session.name || "Faculty",
          lastUpdated: new Date().toISOString()
        });

        updateCoordinatorMarkers(lat, lng);
      } catch (error) {
        console.error("Firebase GPS update failed:", error);
      }
    };

    watchId = navigator.geolocation.watchPosition(
      position => {
        const lat = Number(position.coords.latitude);
        const lng = Number(position.coords.longitude);

        if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
          console.error("Invalid GPS coordinates:", position.coords);
          return;
        }

        const rawSpeed = position.coords.speed;
        const speedKmh =
          rawSpeed !== null && Number.isFinite(rawSpeed)
            ? Math.max(0, rawSpeed * 3.6)
            : 0;

        pushGPS(
          Number(lat.toFixed(6)),
          Number(lng.toFixed(6)),
          Number(speedKmh.toFixed(1))
        );
      },
      error => {
        console.error("GPS Error:", error);

        if (error.code === error.PERMISSION_DENIED) {
          alert("Location permission was denied. Please allow GPS access.");
        } else if (error.code === error.POSITION_UNAVAILABLE) {
          alert("GPS location is currently unavailable.");
        } else if (error.code === error.TIMEOUT) {
          alert("GPS request timed out. Please try again.");
        } else {
          alert("Unable to get your location.");
        }

        stopBroadcast(bId);
      },
      {
        enableHighAccuracy: true,
        maximumAge: 5000,
        timeout: 15000
      }
    );
  };

  window.stopBroadcast = async function (bId) {
    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }

    broadcastingBusId = null;

    try {
      await update(ref(db, `buses/${bId}`), {
        isActive: false,
        lastUpdated: new Date().toISOString()
      });
    } catch (error) {
      console.error("Firebase stop update failed:", error);
    }

    const safeId = bId.replace(/\s+/g, "_");
    const startBtn = document.getElementById(`btnStart_${safeId}`);
    const stopBtn = document.getElementById(`btnStop_${safeId}`);

    if (startBtn) startBtn.style.display = "flex";
    if (stopBtn) stopBtn.style.display = "none";

    document.getElementById("homeMapBox").style.display = "none";
  };

  window.openAnnounceModal = () => {
    document.getElementById("announceModal").style.display = "flex";
  };

  window.closeAnnounceModal = () => {
    document.getElementById("announceModal").style.display = "none";
  };

  window.submitAnnouncement = function () {
    const text = document.getElementById("modalInput").value.trim();
    if (!text) return;

    const timeStr = new Date().toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit"
    });

    set(ref(db, `announcements/${assignedBus}/latest`), {
      text,
      author: session.name || "Coordinator",
      busId: assignedBus,
      time: timeStr
    }).then(() => {
      closeAnnounceModal();
      document.getElementById("modalInput").value = "";
    }).catch(error => {
      console.error("Announcement failed:", error);
      alert("Could not broadcast the announcement.");
    });
  };
</script>

</body>
</html>
