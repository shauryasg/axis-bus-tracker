<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
             maximum-scale=1.0, user-scalable=no"
  >

  <title>CampusRide - Coordinator Dashboard</title>

  <!-- Google Maps -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAuzSJx40q1GzH2RZ-EZCE9iRzl-xkaQho&libraries=geometry"></script>

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-light: #eff6ff;

      --bg: #f8fafc;
      --surface: #ffffff;

      --text: #0f172a;
      --text-muted: #64748b;

      --border: #e2e8f0;

      --green: #16a34a;
      --green-bg: #dcfce7;

      --red: #dc2626;
      --red-bg: #fee2e2;

      --yellow: #facc15;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0b1329;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;

      background: var(--bg);

      display: flex;
      flex-direction: column;

      position: relative;
      overflow: hidden;

      box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
    }

    /* =========================
       TOP BAR
    ========================== */

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 14px 20px;

      background: var(--surface);
      border-bottom: 1px solid var(--border);

      position: sticky;
      top: 0;

      z-index: 100;
    }

    .title-group h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    .title-group p {
      font-size: 11px;
      color: var(--text-muted);
    }

    .icon-btn {
      background: none;
      border: none;

      font-size: 22px;
      color: var(--text);

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================
       VIEWS
    ========================== */

    .view {
      display: none;

      flex-direction: column;

      height: 100%;
      width: 100%;

      overflow-y: auto;

      padding-bottom: 75px;
    }

    .view.active {
      display: flex;
    }

    .content-body {
      padding: 16px 20px;

      display: flex;
      flex-direction: column;

      gap: 16px;
    }

    /* =========================
       HERO
    ========================== */

    .hero-banner {
      background:
        linear-gradient(
          135deg,
          #1d4ed8,
          #3b82f6
        );

      border-radius: 16px;

      padding: 18px 20px;

      color: white;
    }

    .hero-banner h2 {
      font-size: 18px;
      margin-bottom: 2px;
    }

    .hero-banner p {
      font-size: 12px;
      opacity: 0.9;
    }

    /* =========================
       SECTION
    ========================== */

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-head h4 {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .badge-tag {
      font-size: 11px;
      font-weight: 700;

      color: var(--primary);
      background: var(--primary-light);

      padding: 4px 8px;

      border-radius: 6px;
    }

    /* =========================
       BUS CARDS
    ========================== */

    .bus-list {
      display: flex;
      flex-direction: column;

      gap: 10px;
    }

    .bus-card {
      background: var(--surface);

      border-radius: 14px;

      padding: 14px;

      border: 1px solid var(--border);

      display: flex;
      flex-direction: column;

      gap: 10px;

      transition: 0.2s;
    }

    .bus-card.assigned {
      border: 2px solid var(--primary);

      background: #f0f7ff;
    }

    .bus-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;
    }

    .bus-meta-group {
      display: flex;
      align-items: center;

      gap: 12px;

      min-width: 0;
    }

    .bus-icon-wrap {
      width: 42px;
      height: 42px;

      flex-shrink: 0;

      border-radius: 10px;

      background: var(--primary-light);
      color: var(--primary);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 20px;
    }

    .bus-id {
      font-size: 14px;

      font-weight: 700;

      color: var(--text);
    }

    .bus-route {
      font-size: 11px;

      color: var(--text-muted);

      margin-top: 2px;

      line-height: 1.3;
    }

    .status-badge {
      font-size: 10px;

      font-weight: 700;

      padding: 4px 8px;

      border-radius: 6px;

      white-space: nowrap;
    }

    .status-live {
      background: var(--green-bg);
      color: var(--green);
    }

    .status-off {
      background: var(--red-bg);
      color: var(--red);
    }

    /* =========================
       GPS BUTTONS
    ========================== */

    .bus-control-row {
      display: flex;

      gap: 8px;

      border-top: 1px solid var(--border);

      padding-top: 10px;
    }

    .btn-broadcast {
      width: 100%;

      padding: 11px;

      border-radius: 9px;

      border: none;

      font-size: 13px;

      font-weight: 700;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 6px;
    }

    .btn-start-gps {
      background: var(--green);
      color: white;
    }

    .btn-stop-gps {
      background: var(--red);
      color: white;

      display: none;
    }

    .btn-broadcast:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* =========================
       MAP
    ========================== */

    .home-map-box {
      display: none;

      margin-top: 4px;

      border-radius: 14px;

      overflow: hidden;

      border: 1px solid var(--border);

      height: 230px;

      position: relative;
    }

    #homeMiniMap {
      width: 100%;
      height: 100%;
    }

    #routesView {
      position: relative;

      padding-bottom: 0;

      overflow: hidden;
    }

    #fullRouteMap {
      width: 100%;
      height: 100%;
    }

    /* =========================
       GPS STATUS
    ========================== */

    .gps-info {
      display: none;

      background: white;

      border: 1px solid var(--border);

      border-radius: 12px;

      padding: 12px;

      font-size: 12px;

      color: var(--text-muted);
    }

    .gps-info strong {
      color: var(--text);
    }

    .gps-live-dot {
      width: 8px;
      height: 8px;

      background: var(--green);

      border-radius: 50%;

      display: inline-block;

      margin-right: 5px;

      box-shadow:
        0 0 0 4px
        rgba(22, 163, 74, 0.15);
    }

    /* =========================
       BOTTOM NAV
    ========================== */

    .bottom-nav {
      position: absolute;

      bottom: 0;

      width: 100%;

      height: 65px;

      background: var(--surface);

      border-top: 1px solid var(--border);

      display: flex;

      justify-content: space-around;

      align-items: center;

      z-index: 1000;
    }

    .nav-tab {
      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 4px;

      color: var(--text-muted);

      font-size: 10px;

      cursor: pointer;

      border: none;

      background: none;

      flex: 1;
    }

    .nav-tab i {
      font-size: 20px;
    }

    .nav-tab.active {
      color: var(--primary);

      font-weight: 600;
    }

    /* =========================
       MODAL
    ========================== */

    .modal-overlay {
      position: fixed;

      inset: 0;

      background:
        rgba(15, 23, 42, 0.6);

      backdrop-filter: blur(4px);

      z-index: 2000;

      display: none;

      align-items: center;

      justify-content: center;

      padding: 20px;
    }

    .modal-card {
      background: white;

      width: 100%;

      max-width: 380px;

      border-radius: 18px;

      padding: 22px;
    }

    .modal-card textarea {
      width: 100%;

      height: 90px;

      padding: 10px;

      border: 1px solid var(--border);

      border-radius: 10px;

      font-size: 13px;

      outline: none;

      margin: 12px 0;

      resize: none;
    }

    .modal-actions {
      display: flex;

      gap: 8px;
    }

    .btn-modal {
      flex: 1;

      padding: 10px;

      border-radius: 8px;

      border: none;

      font-size: 13px;

      font-weight: 700;

      cursor: pointer;
    }

    /* =========================
       ERROR
    ========================== */

    .error-box {
      display: none;

      background: var(--red-bg);

      color: var(--red);

      border: 1px solid #fecaca;

      border-radius: 10px;

      padding: 10px;

      font-size: 12px;

      line-height: 1.4;
    }
  </style>
</head>

<body>

<div class="app-container">

  <!-- =========================
       TOP BAR
  ========================== -->

  <div class="top-bar">

    <div class="title-group">

      <h3>CampusRide</h3>

      <p>Coordinator Broadcast Portal</p>

    </div>

    <div style="display:flex;gap:8px;">

      <button
        class="icon-btn"
        onclick="openAnnounceModal()"
        title="Broadcast Delay"
      >
        <i class="ph-bold ph-megaphone"></i>
      </button>

      <button
        class="icon-btn"
        onclick="logout()"
        title="Logout"
      >
        <i class="ph-bold ph-sign-out"></i>
      </button>

    </div>

  </div>


  <!-- =========================
       HOME VIEW
  ========================== -->

  <div
    class="view active"
    id="homeView"
  >

    <div class="content-body">

      <!-- HERO -->

      <div class="hero-banner">

        <h2 id="coordHeroName">
          Welcome, Coordinator 👋
        </h2>

        <p id="coordHeroBus">
          Assigned Bus: BUS 1
        </p>

      </div>


      <!-- FLEET HEADER -->

      <div class="section-head">

        <h4>
          Fleet Control
        </h4>

        <span
          class="badge-tag"
          id="myBusBadge"
        >
          MY BUS: BUS 1
        </span>

      </div>


      <!-- ERROR -->

      <div
        class="error-box"
        id="errorBox"
      ></div>


      <!-- BUS LIST -->

      <div
        class="bus-list"
        id="coordBusList"
      ></div>


      <!-- GPS INFO -->

      <div
        class="gps-info"
        id="gpsInfo"
      >

        <div>
          <span class="gps-live-dot"></span>

          <strong>GPS Broadcasting LIVE</strong>
        </div>

        <br>

        <div>
          Latitude:
          <strong id="gpsLat">--</strong>
        </div>

        <div>
          Longitude:
          <strong id="gpsLng">--</strong>
        </div>

        <div>
          Speed:
          <strong id="gpsSpeed">0 km/h</strong>
        </div>

      </div>


      <!-- MINI MAP -->

      <div
        class="home-map-box"
        id="homeMapBox"
      >

        <div id="homeMiniMap"></div>

      </div>

    </div>

  </div>


  <!-- =========================
       FULL ROUTE MAP
  ========================== -->

  <div
    class="view"
    id="routesView"
  >

    <div id="fullRouteMap"></div>

  </div>


  <!-- =========================
       BOTTOM NAV
  ========================== -->

  <nav class="bottom-nav">

    <button
      class="nav-tab active"
      onclick="switchTab('homeView', this)"
    >

      <i class="ph-bold ph-house"></i>

      <span>Home</span>

    </button>


    <button
      class="nav-tab"
      onclick="switchTab('routesView', this)"
    >

      <i class="ph-bold ph-navigation-arrow"></i>

      <span>Route Map</span>

    </button>

  </nav>

</div>


<!-- =========================
     ANNOUNCEMENT MODAL
========================= -->

<div
  class="modal-overlay"
  id="announceModal"
>

  <div class="modal-card">

    <h3 style="font-size:16px;">
      Broadcast Delay Alert
    </h3>

    <p
      style="
        font-size:11px;
        color:var(--text-muted);
        margin-top:4px;
      "
    >
      Target: Assigned bus passengers
    </p>

    <textarea
      id="modalInput"
      placeholder="e.g. Delayed by 10 mins near Kakadev..."
    ></textarea>

    <div class="modal-actions">

      <button
        class="btn-modal"
        style="background:#f1f5f9;"
        onclick="closeAnnounceModal()"
      >
        Cancel
      </button>

      <button
        class="btn-modal"
        style="
          background:var(--primary);
          color:white;
        "
        onclick="submitAnnouncement()"
      >
        Broadcast
      </button>

    </div>

  </div>

</div>


<!-- =========================
     JAVASCRIPT
========================= -->

<script type="module">

  /* =====================================
     FIREBASE
  ====================================== */

  import {
    db,
    ref,
    set,
    update,
    onValue
  } from "./firebase-config.js";

  import {
    push
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  import {
    AXIS_BUS_ROUTES
  } from "./bus-routes.js";


  /* =====================================
     SESSION
  ====================================== */

  const session = JSON.parse(
    localStorage.getItem("campusride_user") || "null"
  );


  if (
    !session ||
    session.role !== "coordinator"
  ) {

    window.location.href = "login.html";

  }


  /* =====================================
     LOGOUT
  ====================================== */

  window.logout = function () {

    stopBroadcast();

    localStorage.removeItem(
      "campusride_user"
    );

    window.location.href = "login.html";

  };


  /* =====================================
     ASSIGNED BUS
  ====================================== */

  const assignedBus =
    session.busId || "BUS 1";


  document.getElementById(
    "coordHeroName"
  ).innerText =
    `Welcome, ${session.name || "Coordinator"} 👋`;


  document.getElementById(
    "coordHeroBus"
  ).innerText =
    `Assigned Bus: ${assignedBus}`;


  document.getElementById(
    "myBusBadge"
  ).innerText =
    `MY BUS: ${assignedBus}`;


  /* =====================================
     VARIABLES
  ====================================== */

  let fullGoogleMap = null;

  let miniGoogleMap = null;

  let fullBusMarker = null;

  let miniBusMarker = null;

  let liveTrailFull = null;

  let liveTrailMini = null;

  let watchId = null;

  let broadcastingBusId = null;

  let routePolylines = [];


  /* =====================================
     ERROR DISPLAY
  ====================================== */

  function showError(message) {

    const box =
      document.getElementById("errorBox");

    box.innerText = message;

    box.style.display = "block";

  }


  function hideError() {

    const box =
      document.getElementById("errorBox");

    box.innerText = "";

    box.style.display = "none";

  }


  /* =====================================
     GOOGLE MAP INITIALIZATION
  ====================================== */

  function initGoogleCoordinatorMaps() {

    if (
      typeof google === "undefined" ||
      !google.maps
    ) {

      showError(
        "Google Maps could not be loaded. Check your internet connection or Maps API key."
      );

      return;

    }


    const defaultCenter = {
      lat: 26.4499,
      lng: 80.3319
    };


    /* =================================
       FULL ROUTE MAP
    ================================== */

    if (
      !fullGoogleMap &&
      document.getElementById("fullRouteMap")
    ) {

      fullGoogleMap =
        new google.maps.Map(
          document.getElementById(
            "fullRouteMap"
          ),
          {
            center: defaultCenter,

            zoom: 13,

            disableDefaultUI: true,

            zoomControl: true
          }
        );


      drawCoordinatorRoute(
        fullGoogleMap
      );


      liveTrailFull =
        new google.maps.Polyline({

          path: [],

          geodesic: true,

          strokeColor: "#facc15",

          strokeOpacity: 0.9,

          strokeWeight: 4,

          map: fullGoogleMap

        });

    }


    /* =================================
       MINI MAP
    ================================== */

    if (
      !miniGoogleMap &&
      document.getElementById("homeMiniMap")
    ) {

      miniGoogleMap =
        new google.maps.Map(
          document.getElementById(
            "homeMiniMap"
          ),
          {

            center: defaultCenter,

            zoom: 13,

            disableDefaultUI: true

          }
        );


      drawCoordinatorRoute(
        miniGoogleMap
      );


      liveTrailMini =
        new google.maps.Polyline({

          path: [],

          geodesic: true,

          strokeColor: "#facc15",

          strokeOpacity: 0.9,

          strokeWeight: 4,

          map: miniGoogleMap

        });

    }

  }


  /* =====================================
     DRAW ASSIGNED ROUTE
  ====================================== */

  function drawCoordinatorRoute(
    mapInstance
  ) {

    const route =
      AXIS_BUS_ROUTES[assignedBus];


    if (
      !route ||
      !route.stops ||
      !route.stops.length
    ) {

      showError(
        `Route data not found for ${assignedBus}.`
      );

      return;

    }


    const path =
      route.stops.map(stop => ({

        lat: Number(stop.lat),

        lng: Number(stop.lng)

      }));


    const routeLine =
      new google.maps.Polyline({

        path: path,

        geodesic: true,

        strokeColor:
          route.color || "#2563eb",

        strokeOpacity: 0.85,

        strokeWeight: 5,

        map: mapInstance

      });


    routePolylines.push(
      routeLine
    );


    const bounds =
      new google.maps.LatLngBounds();


    path.forEach(position => {

      bounds.extend(position);

    });


    mapInstance.fitBounds(bounds);

  }


  /* =====================================
     BUS MARKER
  ====================================== */

  function updateCoordinatorMarkers(
    lat,
    lng
  ) {

    const position =
      new google.maps.LatLng(
        lat,
        lng
      );


    const iconConfig = {

      url:
        "https://maps.google.com/mapfiles/kml/shapes/bus.png",

      scaledSize:
        new google.maps.Size(
          36,
          36
        ),

      anchor:
        new google.maps.Point(
          18,
          18
        )

    };


    /* MINI MAP */

    if (miniGoogleMap) {

      if (!miniBusMarker) {

        miniBusMarker =
          new google.maps.Marker({

            position,

            map: miniGoogleMap,

            title: assignedBus,

            icon: iconConfig

          });

      } else {

        miniBusMarker.setPosition(
          position
        );

      }


      miniGoogleMap.panTo(
        position
      );

    }


    /* FULL MAP */

    if (fullGoogleMap) {

      if (!fullBusMarker) {

        fullBusMarker =
          new google.maps.Marker({

            position,

            map: fullGoogleMap,

            title: assignedBus,

            icon: iconConfig

          });

      } else {

        fullBusMarker.setPosition(
          position
        );

      }


      fullGoogleMap.panTo(
        position
      );

    }


    /* TRAIL */

    if (liveTrailMini) {

      liveTrailMini
        .getPath()
        .push(position);

    }


    if (liveTrailFull) {

      liveTrailFull
        .getPath()
        .push(position);

    }

  }


  /* =====================================
     BOTTOM NAV
  ====================================== */

  window.switchTab =
    function(viewId, tabEl) {

      document
        .querySelectorAll(".view")
        .forEach(view => {

          view.classList.remove(
            "active"
          );

        });


      const selectedView =
        document.getElementById(
          viewId
        );


      if (selectedView) {

        selectedView.classList.add(
          "active"
        );

      }


      document
        .querySelectorAll(".nav-tab")
        .forEach(tab => {

          tab.classList.remove(
            "active"
          );

        });


      tabEl.classList.add(
        "active"
      );


      if (
        viewId === "routesView"
      ) {

        setTimeout(() => {

          initGoogleCoordinatorMaps();

          if (fullGoogleMap) {

            google.maps.event.trigger(
              fullGoogleMap,
              "resize"
            );

          }

        }, 100);

      }

    };


  /* =====================================
     BUS CARDS
  ====================================== */

  const coordBusList =
    document.getElementById(
      "coordBusList"
    );


  /*
    IMPORTANT:
    This automatically loads:
    BUS 1
    BUS 9
    BUS 3
    BUS 4

    directly from bus-routes.js
  */

  const busKeys =
    Object.keys(
      AXIS_BUS_ROUTES
    );


  function renderCards() {

    coordBusList.innerHTML =
      busKeys.map(bId => {

        const isMine =
          bId === assignedBus;


        const safeId =
          bId.replace(
            /\s+/g,
            "_"
          );


        const route =
          AXIS_BUS_ROUTES[bId];


        return `

          <div
            class="bus-card
              ${isMine ? "assigned" : ""}"
          >

            <div class="bus-top-row">

              <div class="bus-meta-group">

                <div
                  class="bus-icon-wrap"
                >

                  <i
                    class="ph-bold ph-bus"
                  ></i>

                </div>


                <div>

                  <div class="bus-id">

                    ${bId}

                    ${
                      isMine
                      ? `
                        <span
                          style="
                            font-size:10px;
                            color:#2563eb;
                          "
                        >
                          (MY BUS)
                        </span>
                      `
                      : ""
                    }

                  </div>


                  <div class="bus-route">

                    ${
                      route
                      ? route.routeName
                      : "Route unavailable"
                    }

                  </div>

                </div>

              </div>


              <span
                class="status-badge status-off"
                id="pill_${safeId}"
              >
                OFFLINE
              </span>

            </div>


            ${
              isMine
              ? `

                <div class="bus-control-row">

                  <button
                    class="
                      btn-broadcast
                      btn-start-gps
                    "
                    id="btnStart_${safeId}"
                    onclick="
                      startBroadcast('${bId}')
                    "
                  >

                    <i
                      class="
                        ph-bold
                        ph-broadcast
                      "
                    ></i>

                    Make Bus Live

                  </button>


                  <button
                    class="
                      btn-broadcast
                      btn-stop-gps
                    "
                    id="btnStop_${safeId}"
                    onclick="
                      stopBroadcast('${bId}')
                    "
                  >

                    <i
                      class="
                        ph-bold
                        ph-stop-circle
                      "
                    ></i>

                    Stop Broadcast

                  </button>

                </div>

              `
              : ""
            }

          </div>

        `;

      }).join("");

  }


  renderCards();


  /* =====================================
     FIREBASE BUS STATUS LISTENER
  ====================================== */

  onValue(
    ref(db, "buses"),
    snapshot => {

      const data =
        snapshot.val() || {};


      busKeys.forEach(bId => {

        const bus =
          data[bId];


        const safeId =
          bId.replace(
            /\s+/g,
            "_"
          );


        const pill =
          document.getElementById(
            `pill_${safeId}`
          );


        if (!pill) return;


        if (bus?.isActive) {

          pill.className =
            "status-badge status-live";

          pill.innerText =
            "LIVE";

        } else {

          pill.className =
            "status-badge status-off";

          pill.innerText =
            "OFFLINE";

        }

      });

    }

  );


  /* =====================================
     START GPS BROADCAST
  ====================================== */

  window.startBroadcast =
    async function(bId) {

      hideError();


      if (
        !navigator.geolocation
      ) {

        alert(
          "GPS is not supported on this device/browser."
        );

        return;

      }


      /*
        Prevent duplicate watchers
      */

      if (watchId !== null) {

        navigator.geolocation.clearWatch(
          watchId
        );

        watchId = null;

      }


      const safeId =
        bId.replace(
          /\s+/g,
          "_"
        );


      const startBtn =
        document.getElementById(
          `btnStart_${safeId}`
        );


      const stopBtn =
        document.getElementById(
          `btnStop_${safeId}`
        );


      if (startBtn) {

        startBtn.style.display =
          "none";

      }


      if (stopBtn) {

        stopBtn.style.display =
          "flex";

      }


      document.getElementById(
        "homeMapBox"
      ).style.display =
        "block";


      document.getElementById(
        "gpsInfo"
      ).style.display =
        "block";


      /*
        Initialize maps
      */

      initGoogleCoordinatorMaps();


      broadcastingBusId =
        bId;


      /*
        Clear previous trail
      */

      if (liveTrailMini) {

        liveTrailMini.setPath([]);

      }


      if (liveTrailFull) {

        liveTrailFull.setPath([]);

      }


      /*
        Clear Firebase trail
      */

      try {

        await set(
          ref(
            db,
            `buses/${bId}/trail`
          ),
          null
        );

      } catch (error) {

        console.error(
          "Could not clear previous trail:",
          error
        );

      }


      /* =================================
         SEND GPS TO FIREBASE
      ================================== */

      const pushGPS =
        async (
          lat,
          lng,
          speedKmh
        ) => {

          try {

            const timestamp =
              new Date().toISOString();


            /*
              Main live bus data
            */

            await update(
              ref(
                db,
                `buses/${bId}`
              ),
              {

                latitude: lat,

                longitude: lng,

                speed: speedKmh,

                isActive: true,

                coordinatorName:
                  session.name ||
                  "Faculty",

                lastUpdated:
                  timestamp

              }
            );


            /*
              GPS trail
            */

            await push(
              ref(
                db,
                `buses/${bId}/trail`
              ),
              {

                lat: lat,

                lng: lng,

                timestamp:
                  timestamp

              }
            );


            /*
              Update coordinator map
            */

            updateCoordinatorMarkers(
              lat,
              lng
            );


            /*
              Update GPS information
            */

            document.getElementById(
              "gpsLat"
            ).innerText =
              lat.toFixed(6);


            document.getElementById(
              "gpsLng"
            ).innerText =
              lng.toFixed(6);


            document.getElementById(
              "gpsSpeed"
            ).innerText =
              `${speedKmh.toFixed(1)} km/h`;


          } catch (error) {

            console.error(
              "Firebase GPS update failed:",
              error
            );


            showError(
              "GPS received, but Firebase update failed."
            );

          }

        };


      /* =================================
         WATCH DEVICE GPS
      ================================== */

      watchId =
        navigator.geolocation.watchPosition(

          position => {

            const lat =
              Number(
                position.coords.latitude
              );


            const lng =
              Number(
                position.coords.longitude
              );


            if (
              !Number.isFinite(lat) ||
              !Number.isFinite(lng)
            ) {

              console.error(
                "Invalid GPS coordinates:",
                position.coords
              );

              return;

            }


            /*
              Browser GPS speed
              comes in meters/second.
              Convert to km/h.
            */

            const rawSpeed =
              position.coords.speed;


            const speedKmh =
              rawSpeed !== null &&
              Number.isFinite(rawSpeed)

              ? Math.max(
                  0,
                  rawSpeed * 3.6
                )

              : 0;


            pushGPS(
              Number(
                lat.toFixed(6)
              ),

              Number(
                lng.toFixed(6)
              ),

              Number(
                speedKmh.toFixed(1)
              )
            );

          },


          error => {

            console.error(
              "GPS Error:",
              error
            );


            if (
              error.code ===
              error.PERMISSION_DENIED
            ) {

              alert(
                "Location permission was denied. Please allow GPS access and try again."
              );

            }

            else if (
              error.code ===
              error.POSITION_UNAVAILABLE
            ) {

              alert(
                "GPS location is currently unavailable."
              );

            }

            else if (
              error.code ===
              error.TIMEOUT
            ) {

              alert(
                "GPS request timed out. Please try again."
              );

            }

            else {

              alert(
                "Unable to get your location."
              );

            }


            stopBroadcast(
              bId
            );

          },


          {

            enableHighAccuracy:
              true,

            maximumAge:
              5000,

            timeout:
              15000

          }

        );

    };


  /* =====================================
     STOP GPS BROADCAST
  ====================================== */

  window.stopBroadcast =
    async function(
      bId = broadcastingBusId
    ) {

      if (!bId) {

        return;

      }


      if (watchId !== null) {

        navigator.geolocation.clearWatch(
          watchId
        );

        watchId = null;

      }


      broadcastingBusId =
        null;


      /*
        Mark bus offline
      */

      try {

        await update(
          ref(
            db,
            `buses/${bId}`
          ),
          {

            isActive: false,

            lastUpdated:
              new Date().toISOString()

          }
        );

      } catch (error) {

        console.error(
          "Firebase stop update failed:",
          error
        );

      }


      const safeId =
        bId.replace(
          /\s+/g,
          "_"
        );


      const startBtn =
        document.getElementById(
          `btnStart_${safeId}`
        );


      const stopBtn =
        document.getElementById(
          `btnStop_${safeId}`
        );


      if (startBtn) {

        startBtn.style.display =
          "flex";

      }


      if (stopBtn) {

        stopBtn.style.display =
          "none";

      }


      document.getElementById(
        "homeMapBox"
      ).style.display =
        "none";


      document.getElementById(
        "gpsInfo"
      ).style.display =
        "none";


      /*
        Reset GPS information
      */

      document.getElementById(
        "gpsLat"
      ).innerText =
        "--";


      document.getElementById(
        "gpsLng"
      ).innerText =
        "--";


      document.getElementById(
        "gpsSpeed"
      ).innerText =
        "0 km/h";

    };


  /* =====================================
     ANNOUNCEMENT MODAL
  ====================================== */

  window.openAnnounceModal =
    function() {

      document.getElementById(
        "announceModal"
      ).style.display =
        "flex";

    };


  window.closeAnnounceModal =
    function() {

      document.getElementById(
        "announceModal"
      ).style.display =
        "none";

    };


  /* =====================================
     SEND DELAY ANNOUNCEMENT
  ====================================== */

  window.submitAnnouncement =
    async function() {

      const input =
        document.getElementById(
          "modalInput"
        );


      const text =
        input.value.trim();


      if (!text) {

        alert(
          "Please enter a delay message."
        );

        return;

      }


      const timeStr =
        new Date().toLocaleTimeString(
          [],
          {

            hour: "2-digit",

            minute: "2-digit"

          }
        );


      try {

        await set(
          ref(
            db,
            `announcements/${assignedBus}/latest`
          ),
          {

            text: text,

            author:
              session.name ||
              "Coordinator",

            busId:
              assignedBus,

            time:
              timeStr

          }
        );


        closeAnnounceModal();


        input.value = "";


        alert(
          `Delay alert sent for ${assignedBus}.`
        );


      } catch (error) {

        console.error(
          "Announcement failed:",
          error
        );


        alert(
          "Could not broadcast the announcement."
        );

      }

    };


  /* =====================================
     INITIAL CHECK
  ====================================== */

  if (
    !AXIS_BUS_ROUTES[assignedBus]
  ) {

    showError(
      `Your assigned bus "${assignedBus}" is not present in bus-routes.js.`
    );

  }


</script>

</body>
</html>
