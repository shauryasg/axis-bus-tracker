<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusRide - Coordinator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        .app {
            min-height: 100vh;
        }

        /* TOP BAR */
        .topbar {
            height: 65px;
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .topbar h2 {
            font-size: 20px;
        }

        .logout-btn {
            background: #ef4444;
            border: none;
            color: white;
            padding: 9px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* HERO */
        .hero {
            background: #2563eb;
            color: white;
            padding: 25px 20px;
        }

        .hero h1 {
            margin-bottom: 8px;
        }

        .hero p {
            opacity: 0.9;
        }

        /* CONTENT */
        .content {
            padding: 20px;
            max-width: 1000px;
            margin: auto;
        }

        .section-title {
            margin-bottom: 15px;
        }

        /* BUS CARDS */
        .bus-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .bus-card {
            background: white;
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .bus-card h3 {
            margin-bottom: 8px;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .offline {
            background: #fee2e2;
            color: #b91c1c;
        }

        .live {
            background: #dcfce7;
            color: #15803d;
        }

        .gps-btn {
            width: 100%;
            border: none;
            border-radius: 9px;
            padding: 11px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 8px;
        }

        .start-btn {
            background: #16a34a;
            color: white;
        }

        .stop-btn {
            background: #dc2626;
            color: white;
        }

        .gps-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* GPS INFO */
        .gps-info {
            margin-top: 20px;
            background: white;
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .gps-info h3 {
            margin-bottom: 12px;
        }

        .gps-row {
            margin: 7px 0;
            font-size: 14px;
        }

        /* MAP */
        #map {
            width: 100%;
            height: 400px;
            margin-top: 20px;
            border-radius: 14px;
            background: #ddd;
        }

        /* ANNOUNCEMENT */
        .announcement-box {
            margin-top: 20px;
            background: white;
            padding: 18px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .announcement-box textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            resize: vertical;
            margin: 10px 0;
        }

        .announcement-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .topbar {
                padding: 0 12px;
            }

            .content {
                padding: 12px;
            }

            #map {
                height: 320px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- TOP BAR -->
    <div class="topbar">
        <h2>🚌 CampusRide</h2>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>

    <!-- HERO -->
    <div class="hero">
        <h1>Coordinator Dashboard</h1>
        <p id="assignedText">Checking assigned bus...</p>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content">

        <h2 class="section-title">Bus Control</h2>

        <div class="bus-grid" id="busGrid">
            <!-- Bus cards will come here -->
        </div>

        <!-- GPS INFORMATION -->
        <div class="gps-info">
            <h3>📍 GPS Information</h3>

            <div class="gps-row">
                <strong>Status:</strong>
                <span id="gpsStatus">Not started</span>
            </div>

            <div class="gps-row">
                <strong>Latitude:</strong>
                <span id="latitude">---</span>
            </div>

            <div class="gps-row">
                <strong>Longitude:</strong>
                <span id="longitude">---</span>
            </div>

            <div class="gps-row">
                <strong>Speed:</strong>
                <span id="speed">---</span>
            </div>
        </div>

        <!-- MAP -->
        <div id="map"></div>

        <!-- ANNOUNCEMENT -->
        <div class="announcement-box">

            <h3>📢 Send Delay Announcement</h3>

            <textarea
                id="announcementText"
                placeholder="Example: Bus will be 10 minutes late today."
            ></textarea>

            <button
                class="announcement-btn"
                id="announcementBtn"
            >
                Send Announcement
            </button>

        </div>

    </div>

</div>


<!-- GOOGLE MAPS -->
<script
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&libraries=geometry"
    async
    defer>
</script>


<!-- FIREBASE + JAVASCRIPT -->
<script type="module">

    import {
        db,
        ref,
        set,
        update,
        onValue
    } from "./firebase-config.js";

    import {
        push
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    import {
        AXIS_BUS_ROUTES,
        TRANSPORT_TEAM
    } from "./bus-routes.js";


    /* ==========================================
       SESSION
    ========================================== */

    const session =
        JSON.parse(localStorage.getItem("campusride_user"));

    if (!session) {

        alert("Please login first.");

        window.location.href = "login.html";

    }


    if (session && session.role !== "coordinator") {

        alert("Coordinator access required.");

        window.location.href = "index.html";

    }


    /* ==========================================
       ASSIGNED BUS
    ========================================== */

    const assignedBus =
        session?.busId || null;

    document.getElementById("assignedText").textContent =
        assignedBus
            ? "Assigned Bus: " + assignedBus
            : "No bus assigned";


    /* ==========================================
       ELEMENTS
    ========================================== */

    const busGrid =
        document.getElementById("busGrid");

    const gpsStatus =
        document.getElementById("gpsStatus");

    const latitude =
        document.getElementById("latitude");

    const longitude =
        document.getElementById("longitude");

    const speed =
        document.getElementById("speed");


    /* ==========================================
       MAP VARIABLES
    ========================================== */

    let map = null;

    let busMarker = null;

    let watchId = null;

    let selectedBus = null;


    /* ==========================================
       MAP INITIALIZATION
    ========================================== */

    function initMap() {

        if (!window.google || !window.google.maps) {

            console.log("Google Maps not loaded yet.");

            return;

        }

        map = new google.maps.Map(
            document.getElementById("map"),
            {
                center: {
                    lat: 26.4499,
                    lng: 80.3319
                },

                zoom: 13
            }
        );

    }


    window.initMap = initMap;


    /* ==========================================
       LOAD BUS CARDS
    ========================================== */

    function loadBusCards() {

        busGrid.innerHTML = "";

        AXIS_BUS_ROUTES.forEach(bus => {

            const card =
                document.createElement("div");

            card.className = "bus-card";

            const isAssigned =
                bus.busId === assignedBus;

            card.innerHTML = `

                <h3>🚌 ${bus.busId}</h3>

                <p style="margin-bottom:10px;">
                    ${bus.routeName}
                </p>

                <span
                    class="status offline"
                    id="status-${bus.busId}">
                    OFFLINE
                </span>

                ${
                    isAssigned
                    ?
                    `
                    <button
                        class="gps-btn start-btn"
                        onclick="startBroadcast('${bus.busId}')">
                        📍 Start GPS
                    </button>

                    <button
                        class="gps-btn stop-btn"
                        onclick="stopBroadcast('${bus.busId}')">
                        ⛔ Stop GPS
                    </button>
                    `
                    :
                    `
                    <button
                        class="gps-btn"
                        disabled>
                        Not Assigned
                    </button>
                    `
                }

            `;

            busGrid.appendChild(card);

        });

    }


    /* ==========================================
       GPS TEST / START
    ========================================== */

    window.startBroadcast = function(bId) {

        selectedBus = bId;

        /*
         * STEP 1
         * Check if GPS exists
         */

        alert(
            "GPS button clicked for " + bId
        );


        if (!navigator.geolocation) {

            alert(
                "GPS is NOT supported by this browser."
            );

            gpsStatus.textContent =
                "GPS not supported";

            return;

        }


        /*
         * STEP 2
         * Check secure connection
         */

        alert(
            "Secure: " +
            window.isSecureContext +

            "\nProtocol: " +
            location.protocol +

            "\nGeolocation: " +
            ("geolocation" in navigator)
        );


        gpsStatus.textContent =
            "Asking for location permission...";


        /*
         * STEP 3
         * Ask phone for location
         */

        navigator.geolocation.getCurrentPosition(

            function(position) {

                const lat =
                    position.coords.latitude;

                const lng =
                    position.coords.longitude;

                const currentSpeed =
                    position.coords.speed;


                latitude.textContent =
                    lat;

                longitude.textContent =
                    lng;

                speed.textContent =
                    currentSpeed !== null
                    ?
                    currentSpeed + " m/s"
                    :
                    "0";


                gpsStatus.textContent =
                    "GPS WORKING";


                alert(
                    "GPS WORKING!\n\n" +

                    "Latitude: " +
                    lat +

                    "\nLongitude: " +
                    lng
                );


                /*
                 * Show marker
                 */

                if (!map) {

                    initMap();

                }


                if (map) {

                    const positionData = {

                        lat: lat,

                        lng: lng

                    };


                    map.setCenter(
                        positionData
                    );

                    map.setZoom(17);


                    if (busMarker) {

                        busMarker.setMap(null);

                    }


                    busMarker =
                        new google.maps.Marker({

                            position:
                                positionData,

                            map: map,

                            title:
                                bId + " Live Location"

                        });

                }

            },


            function(error) {

                gpsStatus.textContent =
                    "GPS ERROR";

                alert(

                    "GPS ERROR\n\n" +

                    "Code: " +
                    error.code +

                    "\n\nMessage: " +
                    error.message

                );

            },


            {

                enableHighAccuracy: true,

                timeout: 15000,

                maximumAge: 0

            }

        );

    };


    /* ==========================================
       STOP GPS
    ========================================== */

    window.stopBroadcast = async function() {

        if (watchId !== null) {

            navigator.geolocation.clearWatch(
                watchId
            );

            watchId = null;

        }


        gpsStatus.textContent =
            "GPS stopped";


        alert("GPS stopped.");

    };


    /* ==========================================
       LOGOUT
    ========================================== */

    document
        .getElementById("logoutBtn")
        .addEventListener(
            "click",
            function() {

                stopBroadcast();

                localStorage.removeItem(
                    "campusride_user"
                );

                window.location.href =
                    "login.html";

            }
        );


    /* ==========================================
       ANNOUNCEMENT
    ========================================== */

    document
        .getElementById("announcementBtn")
        .addEventListener(
            "click",
            async function() {

                const text =
                    document
                    .getElementById(
                        "announcementText"
                    )
                    .value
                    .trim();


                if (!text) {

                    alert(
                        "Please enter an announcement."
                    );

                    return;

                }


                if (!assignedBus) {

                    alert(
                        "No bus assigned."
                    );

                    return;

                }


                try {

                    await set(

                        ref(
                            db,
                            "announcements/" +
                            assignedBus +
                            "/latest"
                        ),

                        {

                            message: text,

                            timestamp:
                                Date.now(),

                            coordinatorName:
                                session?.name ||
                                "Coordinator"

                        }

                    );


                    alert(
                        "Announcement sent successfully."
                    );


                    document
                        .getElementById(
                            "announcementText"
                        )
                        .value = "";

                }

                catch (error) {

                    console.error(error);

                    alert(
                        "Failed to send announcement."
                    );

                }

            }
        );


    /* ==========================================
       FIREBASE LIVE STATUS
    ========================================== */

    AXIS_BUS_ROUTES.forEach(bus => {

        const busRef =
            ref(
                db,
                "buses/" + bus.busId
            );


        onValue(
            busRef,
            snapshot => {

                const data =
                    snapshot.val();


                const status =
                    document.getElementById(
                        "status-" +
                        bus.busId
                    );


                if (!status) return;


                if (
                    data &&
                    data.isActive
                ) {

                    status.textContent =
                        "LIVE";

                    status.className =
                        "status live";

                }

                else {

                    status.textContent =
                        "OFFLINE";

                    status.className =
                        "status offline";

                }

            }
        );

    });


    /* ==========================================
       INITIAL LOAD
    ========================================== */

    loadBusCards();


    /*
     * Try to initialize map
     * after Google Maps loads.
     */

    setTimeout(
        () => {

            initMap();

        },
        2000
    );

</script>

</body>
  </html>
